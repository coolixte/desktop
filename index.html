<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>just lock it</title>
    <style>
        /* CSS reset and full height */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
            background-color: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px; /* Crucial for the 3D depth effect */
        }

        /* Container for the floating memes */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            transform-style: preserve-3d;
        }

        /* Base styling for generated memes */
        .floating-meme {
            position: absolute;
            object-fit: cover;
            border-radius: 12px; /* Smooth Apple-style rounded corners */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8); /* Deep shadow for 3D separation */
            pointer-events: none; 
            user-select: none;
            will-change: transform, opacity; /* Performance optimization */
        }

        /* Cursor hiding class - applied when in fullscreen */
        .hide-cursor {
            cursor: none;
        }

        /* Overlay message styling */
        #overlay-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-family: 'Consolas', monospace;
            font-size: 1.5rem;
            pointer-events: none; 
            display: none; 
            z-index: 10;
            user-select: none;
        }

        /* Footer styling */
        #footer {
            position: fixed;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Consolas', monospace;
            font-size: 0.75rem;
            font-weight: 300;
            color: rgb(255, 255, 255); 
            z-index: 10;
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div id="canvas"></div>

    <div id="overlay-message">
        i hope you understand why.
    </div>

    <div id="footer">
        2025 ⸱ @Calixte Lamotte ⸱ harmless prank association of pranks
    </div>

    <script>
        (() => {
            // --- Core Prank Logic ---
            const messageElement = document.getElementById("overlay-message");
            const footerElement = document.getElementById("footer");
            const bodyElement = document.body;
            const htmlElement = document.documentElement;
            const canvas = document.getElementById("canvas");

            // --- Floating Memes Data ---
            const memes = [
                "media/lockit.jpeg",
                "media/lockmeme-04.png",
                "media/lockmeme-05.png",
                "media/lockmeme-06.png",
                "media/lockmeme-07.png",
                "media/lockmeme-15.png",
                "media/lockmeme-16.png",
                "media/lockmeme-18.png",
                "media/lockmeme-20.png",
                "media/lockmeme-25.png",
                "media/lockmeme-27.png",
                "media/lockmeme-29.png",
                "media/lockmeme-32.png"
            ];

            /**
             * Generates a single floating meme and animates it across the screen.
             */
            function spawnMeme() {
                const img = document.createElement("img");
                img.src = memes[Math.floor(Math.random() * memes.length)];
                img.className = "floating-meme";

                // Random dimensions (between 15vw and 40vw to mimic different photo depths)
                const size = Math.random() * 25 + 15;
                img.style.width = `${size}vw`;

                // Starting coordinates (spread across the viewport, sometimes slightly off-screen)
                const startX = (Math.random() * 120) - 10; // -10vw to 110vw
                const startY = (Math.random() * 120) - 10; // -10vh to 110vh
                const startZ = (Math.random() * 600) - 300; // Deep 3D perspective

                // Calculate a slow drift end point
                const endX = startX + (Math.random() * 30 - 15); 
                const endY = startY + (Math.random() * 30 - 15);
                const endZ = startZ + (Math.random() * 200 - 100);

                // Slight rotations for a natural float
                const startRot = Math.random() * 10 - 5; 
                const endRot = startRot + (Math.random() * 10 - 5);

                canvas.appendChild(img);

                // Animation duration between 15 and 25 seconds
                const duration = Math.random() * 10000 + 15000; 

                // Web Animations API
                const animation = img.animate([
                    { transform: `translate3d(${startX}vw, ${startY}vh, ${startZ}px) rotate(${startRot}deg)`, opacity: 0 },
                    { opacity: 0.8, offset: 0.1 }, // Fade in early
                    { opacity: 0.8, offset: 0.9 }, // Hold opacity
                    { transform: `translate3d(${endX}vw, ${endY}vh, ${endZ}px) rotate(${endRot}deg)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'linear',
                    fill: 'forwards'
                });

                // Clean up DOM to prevent lag when animation finishes
                animation.onfinish = () => img.remove();
            }

            // Start the screensaver loop (spawns a new image every 3.5 seconds)
            setInterval(spawnMeme, 3500);
            
            // Spawn initial batch so the screen isn't empty immediately
            spawnMeme();
            setTimeout(spawnMeme, 1000);
            setTimeout(spawnMeme, 2000);


            // --- Fullscreen & Security Event Listeners ---
            async function enterFullscreen() {
                try {
                    if (!document.fullscreenElement) {
                        await htmlElement.requestFullscreen();
                    }
                } catch (err) {
                    console.error("Error attempting to enable fullscreen:", err);
                }
            }

            function handleFullscreenChange() {
                if (document.fullscreenElement) {
                    bodyElement.classList.add("hide-cursor");
                    messageElement.style.display = "none";
                    footerElement.style.display = "none";
                } else {
                    bodyElement.classList.remove("hide-cursor");
                    messageElement.style.display = "block";
                    footerElement.style.display = "block";
                }
            }

            document.addEventListener("click", async () => {
                await enterFullscreen();
            });

            document.addEventListener("fullscreenchange", handleFullscreenChange);
            document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
            document.addEventListener("mozfullscreenchange", handleFullscreenChange);
            document.addEventListener("MSFullscreenChange", handleFullscreenChange);

            document.addEventListener("contextmenu", (event) => event.preventDefault());

            document.addEventListener("keydown", (event) => {
                if (event.key === "F11" || event.key === "F12") {
                    event.preventDefault();
                }
            });

        })();
    </script>
</body>
</html>
