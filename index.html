<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>just lock it</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
        }

        #scene-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            perspective: 1200px; 
            z-index: 1;
            pointer-events: none;
        }

        #world {
            position: absolute;
            width: 100vw;
            height: 100vh;
            transform-style: preserve-3d;
            transform-origin: 50% 50% -150px;
            transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
            transition: transform 3.8s cubic-bezier(0.25, 1, 0.5, 1); /* Silky deceleration curve */
        }

        .floating-meme {
            position: absolute;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.5);
            pointer-events: none; 
            user-select: none;
            will-change: transform, opacity; 
        }

        .hide-cursor { 
            cursor: none; 
        }

        #overlay-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.85);
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px 32px;
            border-radius: 12px;
            text-align: center;
            font-family: 'Consolas', monospace;
            font-size: 1.25rem;
            pointer-events: none; 
            display: none; 
            z-index: 10;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: max-content;
            max-width: 80vw;
        }

        #footer {
            position: fixed;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Consolas', monospace;
            font-size: 0.75rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5); 
            z-index: 10;
            pointer-events: none; 
            padding: 0 1rem;
        }
    </style>
</head>
<body>

    <div id="scene-wrapper">
        <div id="world"></div>
    </div>

    <div id="overlay-message">
        i hope you understand why.
    </div>

    <div id="footer">
        2025 ⸱ @Calixte Lamotte ⸱ harmless prank association of pranks
    </div>

    <script>
        (() => {
            const messageElement = document.getElementById("overlay-message");
            const footerElement = document.getElementById("footer");
            const bodyElement = document.body;
            const htmlElement = document.documentElement;
            const world = document.getElementById("world");

            const memes = [
        "media/1.png",
        "media/2.jpg",
        "media/3.jpg",
        "media/4.jpeg",
        "media/5.jpeg",
        "media/6.jpeg",
        "media/7.jpeg",
        "media/8.png",
        "media/9.png",
        "media/10.png",
        "media/11.png",
        "media/12.png",
        "media/13.png",
        "media/14.png",
        "media/15.png",
        "media/16.png",
        "media/17.png",
        "media/18.png",
        "media/19.png",
        "media/20.png",
        "media/21.png",
        "media/22.png",
        "media/23.jpeg",
        "media/24.jpg",
        "media/25.jpg",
        "media/26.png",
        "media/27.png",
        "media/28.jpg",
        "media/29.jpg"
       ];

            let currentRotX = 0;
            let currentRotY = 0;
            let currentRotZ = 0;

            function getScreenMetrics() {
                const width = window.innerWidth;
                const isMobile = width <= 600;
                const isTablet = width > 600 && width <= 1024;

                return {
                    isMobile,
                    minWidthPx: isMobile ? 220 : (isTablet ? 260 : 320),
                    maxWidthPx: isMobile ? 310 : (isTablet ? 360 : 450),
                    targetConcurrent: isMobile ? 3 : (isTablet ? 5 : 7),
                    spawnIntervalMs: isMobile ? 5500 : (isTablet ? 3800 : 2800)
                };
            }

            function spawnMeme(isInitial = false) {
                const metrics = getScreenMetrics();
                const img = document.createElement("img");
                img.src = memes[Math.floor(Math.random() * memes.length)];
                img.className = "floating-meme";

                const pixelSize = Math.random() * (metrics.maxWidthPx - metrics.minWidthPx) + metrics.minWidthPx;
                img.style.width = `${pixelSize}px`;

                const vwSafeMargin = (pixelSize / window.innerWidth) * 100;
                const maxLeftVw = Math.max(0, 100 - vwSafeMargin);
                const startXVw = Math.random() * maxLeftVw;

                const startY = 115;
                const endY = -55;
                const zDepth = (Math.random() * -300) + 50;

                const isZoomingIn = Math.random() > 0.5;
                const startScale = isZoomingIn ? 0.94 : 1.06;
                const endScale = isZoomingIn ? 1.06 : 0.94;
                
                world.appendChild(img);

                const duration = Math.random() * 8000 + 22000; 
                const delay = isInitial ? -(Math.random() * duration) : 0;

                const animation = img.animate([
                    { 
                        transform: `translate3d(${startXVw}vw, ${startY}vh, ${zDepth}px) scale(${startScale})`, 
                        opacity: 0 
                    },
                    { opacity: 0.95, offset: 0.12 },
                    { opacity: 0.95, offset: 0.88 },
                    { 
                        transform: `translate3d(${startXVw}vw, ${endY}vh, ${zDepth}px) scale(${endScale})`, 
                        opacity: 0 
                    }
                ], {
                    duration: duration,
                    delay: delay,
                    easing: 'linear', 
                    fill: 'forwards'
                });

                animation.onfinish = () => img.remove();
            }

            /**
             * FIXED 3D TUMBLE:
             * Axes must ONLY rotate in perfect 360-degree increments.
             * This ensures the 3D volume always lands perfectly square to the user's screen,
             * preventing images from drifting diagonally after a spin.
             */
            function execute3DSpin() {
                // Always do a full vertical flip
                currentRotX += (Math.random() > 0.5 ? 360 : -360);

                // 50% chance to also do a horizontal flip
                if (Math.random() > 0.5) {
                    currentRotY += (Math.random() > 0.5 ? 360 : -360);
                }

                // Apply the transform. Because they are exact multiples of 360,
                // the rotation looks chaotic during the 3.8s transition but ends perfectly aligned.
                world.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg) rotateZ(0deg)`;
            }

            let spawnTimer = null;
            function restartSpawner() {
                if (spawnTimer) clearInterval(spawnTimer);
                const metrics = getScreenMetrics();
                spawnTimer = setInterval(() => spawnMeme(false), metrics.spawnIntervalMs);
            }

            function initScene() {
                world.innerHTML = '';
                const metrics = getScreenMetrics();
                for (let i = 0; i < metrics.targetConcurrent; i++) {
                    spawnMeme(true);
                }
                restartSpawner();
            }

            initScene();
            window.addEventListener('resize', restartSpawner);

            setInterval(execute3DSpin, 24000);

            async function enterFullscreen() {
                try {
                    if (!document.fullscreenElement && htmlElement.requestFullscreen) {
                        await htmlElement.requestFullscreen();
                    }
                } catch (err) {
                    console.error("Fullscreen request declined:", err);
                }
            }

            function handleFullscreenChange() {
                if (document.fullscreenElement) {
                    bodyElement.classList.add("hide-cursor");
                    messageElement.style.display = "none";
                    footerElement.style.display = "none";
                } else {
                    bodyElement.classList.remove("hide-cursor");
                    messageElement.style.display = "block";
                    footerElement.style.display = "block";
                }
            }

            document.addEventListener("click", enterFullscreen);
            document.addEventListener("touchstart", enterFullscreen, { passive: true });

            document.addEventListener("fullscreenchange", handleFullscreenChange);
            document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
            document.addEventListener("mozfullscreenchange", handleFullscreenChange);
            document.addEventListener("MSFullscreenChange", handleFullscreenChange);

            document.addEventListener("contextmenu", (e) => e.preventDefault());
            document.addEventListener("keydown", (e) => {
                if (e.key === "F11" || e.key === "F12") e.preventDefault();
            });
        })();
    </script>
</body>
</html>
